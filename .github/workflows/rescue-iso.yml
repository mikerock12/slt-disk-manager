name: Build and boot Rescue ISO
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/rescue-agent/**'
      - 'rescue/**'
      - '.github/workflows/rescue-iso.yml'
      - 'VERSION'
  push:
    branches: [main]
    paths:
      - 'src/rescue-agent/**'
      - 'rescue/**'
      - '.github/workflows/rescue-iso.yml'
      - 'VERSION'
permissions:
  contents: read
concurrency:
  group: rescue-iso-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/rescue-agent/go.mod
          cache: false
      - name: Test and build Linux agent
        working-directory: src/rescue-agent
        run: |
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o ../../rescue/slt-rescue-agent ./cmd/slt-rescue-agent
      - name: Build Debian live image in disposable container
        timeout-minutes: 50
        run: |
          mkdir -p artifacts
          set -o pipefail
          docker run --rm --privileged -e DEBIAN_FRONTEND=noninteractive -e "SLT_OUTPUT_OWNER=$(id -u):$(id -g)" -v "$PWD:/work" -w /work debian:trixie bash -euxo pipefail -c '
            apt-get update
            apt-get install -y --no-install-recommends live-build debootstrap xorriso squashfs-tools syslinux-common syslinux-utils isolinux grub-pc-bin grub-efi-amd64-bin dosfstools mtools ca-certificates wget cpio file rsync zstd
            SLT_BUILD_DIR=/work/artifacts/rescue-iso bash /work/rescue/scripts/build-debian-live.sh
            chown "$SLT_OUTPUT_OWNER" /work/artifacts/rescue-iso /work/artifacts/rescue-iso/live-image-amd64.hybrid.iso /work/artifacts/rescue-iso/live-image-amd64.hybrid.iso.sha256 /work/artifacts/rescue-iso/packages.tsv /work/artifacts/rescue-iso/source-index.tsv /work/artifacts/rescue-iso/package-copyrights.tar.gz
          ' 2>&1 | tee artifacts/rescue-iso-build.log
      - name: Install isolated VM test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Boot actual ISO in BIOS and UEFI (no disks, no network)
        timeout-minutes: 14
        run: bash rescue/scripts/test-iso-boot.sh artifacts/rescue-iso/live-image-amd64.hybrid.iso artifacts/rescue-boot
      - name: Preserve ISO, hashes and boot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slt-rescue-iso-and-boot-evidence
          path: |
            artifacts/rescue-iso/live-image-amd64.hybrid.iso
            artifacts/rescue-iso/live-image-amd64.hybrid.iso.sha256
            artifacts/rescue-iso/packages.tsv
            artifacts/rescue-iso/source-index.tsv
            artifacts/rescue-iso/package-copyrights.tar.gz
            artifacts/rescue-iso-build.log
            artifacts/rescue-boot/
          compression-level: 0
          retention-days: 14
      - name: Attach tested Rescue ISO to matching release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          tag="v$version"
          for attempt in $(seq 1 30); do
            if gh release view "$tag" --json targetCommitish >/dev/null 2>&1; then break; fi
            sleep 10
          done
          target=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
          test "$target" = "$GITHUB_SHA" || { echo 'Existing release preserved; VERSION does not match this commit.'; exit 0; }
          (cd artifacts/rescue-iso && sha256sum --check live-image-amd64.hybrid.iso.sha256)
          iso="SLT-Rescue-$version-amd64.iso"
          cp artifacts/rescue-iso/live-image-amd64.hybrid.iso "artifacts/$iso"
          (cd artifacts && sha256sum "$iso" > "$iso.sha256")
          gh release upload "$tag" "artifacts/$iso" "artifacts/$iso.sha256" artifacts/rescue-iso/packages.tsv artifacts/rescue-iso/source-index.tsv artifacts/rescue-iso/package-copyrights.tar.gz --clobber
