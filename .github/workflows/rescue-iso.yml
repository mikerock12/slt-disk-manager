name: Build and boot Rescue ISO
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/rescue-agent/**'
      - 'rescue/**'
      - '.github/workflows/rescue-iso.yml'
      - 'VERSION'
      - 'src/network-boot/**'
      - 'scripts/build-ipxe-bootstrap.sh'
      - 'scripts/approve-netboot-profiles.py'
  push:
    branches: [main]
    paths:
      - 'src/rescue-agent/**'
      - 'rescue/**'
      - '.github/workflows/rescue-iso.yml'
      - 'VERSION'
      - 'src/network-boot/**'
      - 'scripts/build-ipxe-bootstrap.sh'
      - 'scripts/approve-netboot-profiles.py'
permissions:
  contents: read
concurrency:
  group: rescue-iso-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/rescue-agent/go.mod
          cache: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build isolated boot service and Controller
        run: |
          dotnet build src/network-boot/SLT.NetworkBoot.Service -c Release
          dotnet build src/server/SLT.Controller.Host -c Release
          dotnet run --project src/network-boot/tests/SLT.NetworkBoot.Tests -c Release
      - name: Test and build Linux agent
        working-directory: src/rescue-agent
        run: |
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o ../../rescue/slt-rescue-agent ./cmd/slt-rescue-agent
      - name: Build Debian live image in disposable container
        timeout-minutes: 50
        run: |
          mkdir -p artifacts
          set -o pipefail
          docker run --rm --privileged -e DEBIAN_FRONTEND=noninteractive -e "SLT_OUTPUT_OWNER=$(id -u):$(id -g)" -v "$PWD:/work" -w /work debian:trixie bash -euxo pipefail -c '
            apt-get update
            apt-get install -y --no-install-recommends live-build debootstrap xorriso squashfs-tools syslinux-common syslinux-utils isolinux grub-pc-bin grub-efi-amd64-bin dosfstools mtools ca-certificates wget cpio file rsync zstd
            SLT_BUILD_DIR=/work/artifacts/rescue-iso bash /work/rescue/scripts/build-debian-live.sh
            chown "$SLT_OUTPUT_OWNER" /work/artifacts/rescue-iso /work/artifacts/rescue-iso/live-image-amd64.hybrid.iso /work/artifacts/rescue-iso/live-image-amd64.hybrid.iso.sha256 /work/artifacts/rescue-iso/packages.tsv /work/artifacts/rescue-iso/source-index.tsv /work/artifacts/rescue-iso/package-copyrights.tar.gz
          ' 2>&1 | tee artifacts/rescue-iso-build.log
      - name: Install isolated VM test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf dnsmasq iproute2 xorriso build-essential liblzma-dev git
      - name: Export Rescue netboot and build pinned iPXE bootstrap
        run: |
          version=$(tr -d '\r\n' < VERSION)
          python3 rescue/pxe/export-rescue-netboot.py artifacts/rescue-iso/live-image-amd64.hybrid.iso artifacts/rescue-netboot --version "$version" --source-commit "$GITHUB_SHA"
          bash scripts/build-ipxe-bootstrap.sh "$PWD/artifacts/ipxe-bootstrap"
          python3 rescue/pxe/test-export-rescue-netboot.py
          python3 rescue/pxe/test-netboot-diagnostics.py
      - name: Actual PXE BIOS and UEFI in isolated network namespace (no ISO/USB)
        timeout-minutes: 30
        run: |
          sudo env PATH="$PATH" python3 rescue/pxe/test-netboot-vm.py --service-dll src/network-boot/SLT.NetworkBoot.Service/bin/Release/net10.0/SLT.NetworkBoot.Service.dll --rescue-profile artifacts/rescue-netboot --bootstrap-profile artifacts/ipxe-bootstrap --controller-dll src/server/SLT.Controller.Host/bin/Release/net10.0/SLT.Controller.Host.dll --local-system-image artifacts/rescue-iso/live-image-amd64.hybrid.iso --output artifacts/pxe-lab
          sudo chown -R "$(id -u):$(id -g)" artifacts/pxe-lab
      - name: Boot actual ISO in BIOS and UEFI (no disks, no network)
        timeout-minutes: 14
        run: bash rescue/scripts/test-iso-boot.sh artifacts/rescue-iso/live-image-amd64.hybrid.iso artifacts/rescue-boot
      - name: Approve exact boot payloads only after all laboratory gates
        run: python3 scripts/approve-netboot-profiles.py artifacts/pxe-lab/receipt.json artifacts/rescue-netboot/netboot-manifest.json artifacts/ipxe-bootstrap/netboot-manifest.json artifacts/trusted-netboot/trusted-boot-profiles.json
      - uses: actions/upload-artifact@v7
        with:
          name: slt-netboot-profiles
          path: artifacts/trusted-netboot/trusted-boot-profiles.json
          retention-days: 14
      - name: Make laboratory evidence readable even after a failed gate
        if: always()
        run: |
          if test -d artifacts/pxe-lab; then sudo chown -R "$(id -u):$(id -g)" artifacts/pxe-lab; fi
      - name: Preserve ISO, hashes and boot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slt-rescue-iso-and-boot-evidence
          path: |
            artifacts/rescue-iso/live-image-amd64.hybrid.iso
            artifacts/rescue-iso/live-image-amd64.hybrid.iso.sha256
            artifacts/rescue-iso/packages.tsv
            artifacts/rescue-iso/source-index.tsv
            artifacts/rescue-iso/package-copyrights.tar.gz
            artifacts/rescue-iso-build.log
            artifacts/rescue-boot/
            artifacts/pxe-lab/
            artifacts/rescue-netboot/
            artifacts/ipxe-bootstrap/
          compression-level: 0
          retention-days: 14
  publish-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-boot]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: slt-rescue-iso-and-boot-evidence
          path: artifacts
      - name: Attach tested Rescue ISO and netboot to matching release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          tag="v$version"
          for attempt in $(seq 1 90); do
            if gh release view "$tag" --json targetCommitish >/dev/null 2>&1; then break; fi
            sleep 10
          done
          target=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
          test "$target" = "$GITHUB_SHA" || { echo 'Existing release preserved; VERSION does not match this commit.'; exit 0; }
          (cd artifacts/rescue-iso && sha256sum --check live-image-amd64.hybrid.iso.sha256)
          iso="SLT-Rescue-$version-amd64.iso"
          cp artifacts/rescue-iso/live-image-amd64.hybrid.iso "artifacts/$iso"
          (cd artifacts && sha256sum "$iso" > "$iso.sha256")
          netboot="SLT-Netboot-$version-amd64.zip"
          python3 - "$netboot" <<'PY'
          import sys,zipfile
          from pathlib import Path
          with zipfile.ZipFile(Path('artifacts')/sys.argv[1], 'x', zipfile.ZIP_DEFLATED) as z:
              for directory in ['rescue-netboot','ipxe-bootstrap']:
                  for p in sorted((Path('artifacts')/directory).rglob('*')):
                      if p.is_file(): z.write(p,p.relative_to('artifacts').as_posix())
              z.write('docs/NETWORK-BOOT-OPERACAO.md','LEIA-ME.md')
              z.write('artifacts/pxe-lab/receipt.json','LAB-RECEIPT.json')
          PY
          (cd artifacts && sha256sum "$netboot" > "$netboot.sha256")
          gh release upload "$tag" "artifacts/$iso" "artifacts/$iso.sha256" "artifacts/$netboot" "artifacts/$netboot.sha256" artifacts/rescue-iso/packages.tsv artifacts/rescue-iso/source-index.tsv artifacts/rescue-iso/package-copyrights.tar.gz --clobber
